name: RSS Cron

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger RSS fetch
        run: |
          curl -sf -X GET "${{ secrets.VERCEL_URL }}/api/cron/rss" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
