name: RSS Cron

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger RSS fetch
        run: |
          curl -sf --max-time 90 -X GET "${{ secrets.VERCEL_URL }}/api/cron/rss" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
